name: Snap Hutao Remastered Alpha

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v7

      - name: Setup .NET 11 RC2
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100-rc.2.26504.105

      - name: Build and test craft hotkey native module
        shell: pwsh
        run: ./scripts/BuildCraftHotkeyIsland.ps1

      # This test reads real CN and global game registry entries, absent on hosted runners.
      - name: Run upstream tests (excluding installed-game registry inspection)
        shell: pwsh
        run: dotnet test src/Snap.Hutao.Remastered/Snap.Hutao.Remastered.Test/Snap.Hutao.Remastered.Test.csproj --configuration Release --filter "FullyQualifiedName!=Snap.Hutao.Remastered.Test.IncomingFeature.GameRegistryContentTest.GetRegistryContent" --logger "trx;LogFileName=tests.trx"

      - name: Build personal test MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=SnapHutaoRemasteringProject CI' `
            -FriendlyName 'Snap Hutao Personal Test' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable -KeyUsage DigitalSignature `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') `
            -NotAfter (Get-Date).AddMonths(3)
          $password = [Guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$password"
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $pfxFile = Join-Path $env:RUNNER_TEMP 'personal-test.pfx'
          Export-PfxCertificate -Cert $certificate -FilePath $pfxFile -Password $securePassword | Out-Null
          Export-Certificate -Cert $certificate -FilePath 'personal-test.cer' | Out-Null
          $env:CERTIFICATE = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfxFile))
          Write-Output "::add-mask::$env:CERTIFICATE"
          $env:PW = $password
          try {
            dotnet tool restore
            if ($LASTEXITCODE -ne 0) { throw 'Tool restore failed' }
            dotnet cake build.cake
            if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          }
          finally {
            Remove-Item -LiteralPath $pfxFile -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath 'temp.pfx' -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $certificate.PSPath -Force -ErrorAction SilentlyContinue
            $env:CERTIFICATE = $null
            $env:PW = $null
          }

      - name: Verify packaged craft hotkey module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nativeHash = (Get-FileHash 'src/Snap.Hutao.Remastered/Snap.Hutao.Remastered/Assets/Native/CraftModifiersIsland.dll' -Algorithm SHA256).Hash
          $packages = @(Get-ChildItem 'src/output/*.msix')
          if ($packages.Count -ne 1) { throw 'Expected one personal MSIX' }
          $package = $packages[0]
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entry = $archive.GetEntry('Assets/Native/CraftModifiersIsland.dll')
            if ($null -eq $entry) { throw 'Craft module missing from MSIX' }
            $stream = $entry.Open()
            try { $packageHash = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash }
            finally { $stream.Dispose() }
            if ($packageHash -ne $nativeHash) { throw 'Packaged native module hash mismatch' }
            Write-Output "Packaged native module verified: $nativeHash"
          }
          finally { $archive.Dispose() }

      - name: Upload personal test package and public certificate
        uses: actions/upload-artifact@v7
        with:
          name: Hutao-UID-Test-${{ github.run_number }}
          path: |
            src/output/*.msix
            personal-test.cer
          if-no-files-found: error
          retention-days: 14

      - name: Explain the test package
        shell: pwsh
        run: |
          @'
          ## Personal UID test build
          Download the Hutao-UID-Test artifact below. It contains the Alpha MSIX and its public test certificate.
          This is a personal test build, not an official release. No upstream signing keys are used.
          The existing HidePlayerInfo option also hides the profile name and birthday.
          '@ >> $env:GITHUB_STEP_SUMMARY

