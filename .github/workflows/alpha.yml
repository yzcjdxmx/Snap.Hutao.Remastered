name: Background FPS PR validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100

      - name: Run Debug tests
        shell: pwsh
        run: dotnet test src/Snap.Hutao.Remastered/Snap.Hutao.Remastered.Test/Snap.Hutao.Remastered.Test.csproj -c Debug --logger "trx;LogFileName=background-fps.trx" -- RunConfiguration.TreatNoTestsAsError=true

      - name: Publish Debug Native AOT app
        shell: pwsh
        run: >-
          dotnet publish src/Snap.Hutao.Remastered/Snap.Hutao.Remastered/Snap.Hutao.Remastered.csproj
          -c Debug -r win-x64 -p:Platform=x64 -p:PublishAot=true -p:PublishTrimmed=true
          -p:PublishReadyToRun=false -p:AppxPackageSigningEnabled=false -p:AppxBundle=Never
          -o artifacts/background-fps-aot

      - name: Verify Native AOT output
        shell: pwsh
        run: ./scripts/Test-PackageRuntime.ps1 -PublishDirectory artifacts/background-fps-aot -RuntimeKind NativeAOT
