name: Snap Hutao Remastered Alpha

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build personal test MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=SnapHutaoRemasteringProject CI' `
            -FriendlyName 'Snap Hutao Personal Test' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable -KeyUsage DigitalSignature `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') `
            -NotAfter (Get-Date).AddMonths(3)
          $password = [Guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$password"
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $pfxFile = Join-Path $env:RUNNER_TEMP 'personal-test.pfx'
          Export-PfxCertificate -Cert $certificate -FilePath $pfxFile -Password $securePassword | Out-Null
          Export-Certificate -Cert $certificate -FilePath 'personal-test.cer' | Out-Null
          $env:CERTIFICATE = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfxFile))
          Write-Output "::add-mask::$env:CERTIFICATE"
          $env:PW = $password
          try {
            dotnet tool restore
            if ($LASTEXITCODE -ne 0) { throw 'Tool restore failed' }
            dotnet cake build.cake
            if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          }
          finally {
            Remove-Item -LiteralPath $pfxFile -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath 'temp.pfx' -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $certificate.PSPath -Force -ErrorAction SilentlyContinue
            $env:CERTIFICATE = $null
            $env:PW = $null
          }

      - name: Upload personal test package and public certificate
        uses: actions/upload-artifact@v7
        with:
          name: Hutao-UID-Test-${{ github.run_number }}
          path: |
            src/output/*.msix
            personal-test.cer
          if-no-files-found: error
          retention-days: 14

      - name: Explain the test package
        shell: pwsh
        run: |
          @'
          ## Personal UID test build
          Download the Hutao-UID-Test artifact below. It contains the Alpha MSIX and its public test certificate.
          This is a personal test build, not an official release. No upstream signing keys are used.
          The existing HidePlayerInfo option also hides the profile name and birthday.
          '@ >> $env:GITHUB_STEP_SUMMARY
