name: Performance Panel Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100

      - name: Verify CPU sampling and legacy panel settings under Native AOT
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'HutaoCpuProbe'
          dotnet new console --framework net11.0 --no-restore --output $probe
          Copy-Item -LiteralPath 'src/Snap.Hutao.Remastered/Snap.Hutao.Remastered/Service/Game/Launching/PerformancePanelHardwareMonitor.cs' -Destination $probe
          Copy-Item -LiteralPath 'src/Snap.Hutao.Remastered/Snap.Hutao.Remastered/Service/Game/PerformancePanelPercentage.cs' -Destination $probe
          @'
          using Snap.Hutao.Remastered.Service.Game;
          using Snap.Hutao.Remastered.Service.Game.Launching;

          foreach (string value in new[] { "NaN", "Infinity", "-Infinity", "1e100", "invalid", " " })
          {
              AssertPercentage(89, PerformancePanelPercentage.Parse(value, 89, 0, 100));
              AssertPercentage(100, PerformancePanelPercentage.Parse(value, 100, 70, 170));
          }
          AssertPercentage(89, PerformancePanelPercentage.Normalize(float.NaN, 89, 0, 100));
          AssertPercentage(0, PerformancePanelPercentage.Parse("0", 89, 0, 100));
          AssertPercentage(100, PerformancePanelPercentage.Parse("140", 89, 0, 100));
          AssertPercentage(70, PerformancePanelPercentage.Parse("50", 100, 70, 170));
          AssertPercentage(170, PerformancePanelPercentage.Parse("200", 100, 70, 170));
          AssertPercentage(125, PerformancePanelPercentage.Parse("125", 100, 70, 170));

          PerformancePanelHardwareMonitor monitor = new();
          try
          {
              _ = monitor.Read();
              await Task.Delay(1100);
              if (monitor.Read().CpuUsage is not (>= 0 and <= 100))
              {
                  throw new InvalidOperationException("System CPU usage was unavailable in Native AOT.");
              }
          }
          finally
          {
              await monitor.StopAsync();
          }

          static void AssertPercentage(float expected, float actual)
          {
              if (expected != actual)
              {
                  throw new InvalidOperationException($"Expected {expected}, got {actual}.");
              }
          }
          '@ | Set-Content -LiteralPath (Join-Path $probe 'Program.cs')
          $binary = Join-Path $probe 'aot'
          dotnet publish $probe -c Release -r win-x64 -p:PublishAot=true -o $binary
          & (Join-Path $binary 'HutaoCpuProbe.exe')

      - name: Publish Debug Native AOT app
        shell: pwsh
        run: >-
          dotnet publish src/Snap.Hutao.Remastered/Snap.Hutao.Remastered/Snap.Hutao.Remastered.csproj
          -c Debug -r win-x64 -p:Platform=x64 -p:PublishAot=true -p:PublishTrimmed=true
          -p:PublishReadyToRun=false -p:AppxPackageSigningEnabled=false -p:AppxBundle=Never
          -o artifacts/performance-panel-aot

      - name: Prepare and verify portable preview
        shell: pwsh
        run: |
          $directory = 'artifacts/performance-panel-aot'
          & './scripts/Test-PackageRuntime.ps1' -PublishDirectory $directory -RuntimeKind NativeAOT
          $symbols = Join-Path $directory 'Snap.Hutao.Remastered.pdb'
          if (Test-Path -LiteralPath $symbols -PathType Leaf) {
            Remove-Item -LiteralPath $symbols
          }
          $presentMon = New-Item -Path $directory -Name PresentMon -ItemType Directory
          $exe = Join-Path $presentMon.FullName 'PresentMon-2.6.0-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/GameTechDev/PresentMon/releases/download/v2.6.0/PresentMon-2.6.0-x64.exe' -OutFile $exe
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          if ($sha -ne 'B2A706BC6AD475749E3B7E3409263AA1E6906D45BDCF993F6DBC0F660188F1AF') {
            throw 'Unexpected PresentMon SHA-256'
          }
          Copy-Item -LiteralPath 'preview/PresentMon-LICENSE.txt' -Destination (Join-Path $presentMon.FullName 'LICENSE.txt')
          Copy-Item -LiteralPath 'preview/Readme.md' -Destination (Join-Path $directory 'Readme.md')
          $launcher = @'
          @echo off
          setlocal
          set "SNAP_HUTAO_PROFILE_ROOT=%LOCALAPPDATA%\SnapHutao-PerformancePanel-Preview"
          pushd "%~dp0"
          start "" "%~dp0Snap.Hutao.Remastered.exe"
          popd
          '@
          [IO.File]::WriteAllText((Join-Path (Resolve-Path $directory) 'Start-PerformancePanel-Preview.cmd'), $launcher.Replace("`r`n", "`n").Replace("`n", "`r`n") + "`r`n", [Text.Encoding]::ASCII)

      - name: Upload portable preview
        uses: actions/upload-artifact@v7
        with:
          name: Hutao-PerformancePanel-Preview-v4.1-x64
          path: artifacts/performance-panel-aot/
          if-no-files-found: error
          retention-days: 14
